<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To do list</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <section class="section">
      <div class="container">
        <h1 class="title">To do List</h1>
      </div>
      <div class="divvv">
        <input
          id="input"
          class="input"
          placeholder="What are you planning today?"
          type="text"
          onkeydown="if (event.key === 'Enter') addd();"
        />
        <div id="inputButton"><button></button></div>

        <button onclick="addd()" class="button is-info">Add</button>
      </div>
      <div id="cont"></div>
      <button id="clear" onclick="clearall()" class="button is-danger">
        Clear All
      </button>

      <script>
        const input = document.getElementById("input");
        const cont = document.getElementById("cont");
        const clear = document.getElementById("clear");

        let todos = [];
        const addd = () => {
          if (input.value === "") return;
          input.value = "";
          todos.push(input.value);
          renderTodo();
        };
        const renderTodo = () => {
          cont.textContent = "";
          for (let i = 0; i < todos.length; i++) {
            const newDiv = document.createElement("div");
            newDiv.textContent = todos[i];
            newDiv.classList.add("ttodo");
            cont.appendChild(newDiv);
          }
        };

        let clearall = () => {
          todos = [];
          renderTodo();
        };
      </script>
    </section>
  </body>
</html>
